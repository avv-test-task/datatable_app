version: '3.8'

services:
  datatable_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datatable_app
    ports:
      - "4200:80"
    volumes:
      - ./backend:/var/www/html/backend
      - ./frontend:/var/www/html/frontend
    networks:
      - network

networks:
  network:
    driver: bridge

